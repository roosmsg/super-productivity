<div
  (click)="editTaskRepeatCfg()"
  [matTooltip]="nextDueTooltip()"
>
  <mat-icon svgIcon="lucide:repeat"></mat-icon>
  <div class="wrap">
    <div class="title">{{ repeatCfg().title }}</div>
    <tag-list
      class="planner-tag-list-shared"
      [task]="repeatCfg()"
    ></tag-list>
  </div>
  <div class="info">
    @if (repeatCfg().isPaused) {
      <mat-icon
        class="paused-icon"
        svgIcon="lucide:pause"
      ></mat-icon>
    }
    {{ repeatInfoText() }}
  </div>
</div>
